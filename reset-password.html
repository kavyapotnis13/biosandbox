<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/iconic.png">
  <title>Reset password — BioSandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrap { max-width: 420px; margin: 4rem auto; padding: 2rem 1.5rem; }
    .auth-title {
      font-family: 'Newsreader', serif; font-size: 2rem; margin: 0 0 0.25rem;
    }
    .auth-sub {
      font-family: 'Inter', sans-serif; color: #666; margin: 0 0 2rem; font-size: 0.95rem;
    }
    .auth-form label {
      display: block; font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #666; margin: 1rem 0 0.4rem;
    }
    .auth-form input {
      width: 100%; padding: 0.65rem 0.75rem; font-family: 'Inter', sans-serif;
      font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;
      background: #fff; box-sizing: border-box;
    }
    .auth-form input:focus { outline: none; border-color: #7a1f1f; }
    .auth-submit {
      width: 100%; margin-top: 1.5rem; padding: 0.75rem;
      background: #7a1f1f; color: #fff; border: none; border-radius: 4px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .auth-submit:hover { background: #601818; }
    .auth-submit:disabled { opacity: 0.6; cursor: wait; }
    .auth-msg {
      margin-top: 1rem; padding: 0.65rem 0.75rem;
      font-family: 'Inter', sans-serif; font-size: 0.9rem;
      border-radius: 4px; display: none;
    }
    .auth-msg.is-error { background: #fdecea; color: #a53324; display: block; }
    .auth-msg.is-info  { background: #eef4fb; color: #2a5db0; display: block; }
    .auth-back {
      display: inline-block; margin-top: 1.25rem; color: #7a1f1f;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <a href="index.html" class="brand">
      <span class="brand-icon" aria-hidden="true"></span>
      BioSandbox
    </a>
  </header>

  <main id="main">
    <div class="auth-wrap">
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-sub" id="auth-sub">Verifying your reset link…</p>

      <form class="auth-form" id="reset-form" hidden>
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">

        <label for="password2">Confirm new password</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="6">

        <button class="auth-submit" type="submit" id="reset-submit">Update password</button>
        <div class="auth-msg" id="auth-msg" role="status"></div>
      </form>

      <a href="login.html" class="auth-back">← Back to sign in</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script>
    const sub    = document.getElementById('auth-sub');
    const form   = document.getElementById('reset-form');
    const submit = document.getElementById('reset-submit');
    const msg    = document.getElementById('auth-msg');

    // When the visitor clicks the email link, Supabase parses the token from
    // the URL hash and fires a 'PASSWORD_RECOVERY' event. Wait for it (or
    // detect an existing recovery session) before showing the new-password form.
    let ready = false;
    function showForm() {
      if (ready) return;
      ready = true;
      sub.textContent = 'Choose a new password below. You\'ll be signed in right after.';
      form.hidden = false;
    }
    function showError(text) {
      sub.textContent = text;
      sub.style.color = '#a53324';
    }

    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showForm();
    });

    // Fallback: if there's already a session when we land here (e.g. Supabase
    // already processed the hash), reveal the form immediately.
    setTimeout(async () => {
      const user = await getCurrentUser();
      if (user) showForm();
      else if (!ready) showError('This reset link is invalid or has expired. Request a new one from the sign-in page.');
    }, 800);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      msg.className = 'auth-msg';
      msg.textContent = '';
      if (p1 !== p2) {
        msg.className = 'auth-msg is-error';
        msg.textContent = 'Passwords don\'t match.';
        return;
      }
      submit.disabled = true;
      const { error } = await updatePassword(p1);
      submit.disabled = false;
      if (error) {
        msg.className = 'auth-msg is-error';
        msg.textContent = error.message;
        return;
      }
      msg.className = 'auth-msg is-info';
      msg.textContent = 'Password updated. Redirecting…';
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    });
  </script>
</body>
</html>
